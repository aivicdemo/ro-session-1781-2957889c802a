AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  AIVIC Backend — 受注データ品質管理・検証システム
  DynamoDB + Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_ENV: production

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name

Resources:
  # ── DynamoDB テーブル ──────────────────────────────────────────

  DynamoDBTable0:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table0"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "0"
        - Key: TableName
          Value: "受注データ検証結果"

  DynamoDBTable1:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table1"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "1"
        - Key: TableName
          Value: "受注データ修正履歴"

  DynamoDBTable2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "2"
        - Key: TableName
          Value: "信頼度スコア"

  DynamoDBAIOCR:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table3"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "3"
        - Key: TableName
          Value: "AI_OCR読込結果"

  DynamoDBTable4:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table4"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "4"
        - Key: TableName
          Value: "音声ガイダンス記録"

  DynamoDBTable5:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table5"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "5"
        - Key: TableName
          Value: "重複受注検出"

  DynamoDBTable6:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table6"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "6"
        - Key: TableName
          Value: "チャネル間矛盾検出"

  DynamoDBTable7:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table7"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "7"
        - Key: TableName
          Value: "連携承認フロー"

  DynamoDBTable8:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table8"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "8"
        - Key: TableName
          Value: "承認者判定履歴"

  DynamoDBTable9:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table9"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "9"
        - Key: TableName
          Value: "基幹システム連携ログ"

  DynamoDBTable10:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table10"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "10"
        - Key: TableName
          Value: "操作履歴"

  DynamoDBTable11:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table11"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "11"
        - Key: TableName
          Value: "クライアント情報"

  DynamoDBTable12:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table12"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "12"
        - Key: TableName
          Value: "受注チャネル"

  DynamoDBTable13:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table13"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "13"
        - Key: TableName
          Value: "修正対象優先度ランク"

  DynamoDBTable14:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table14"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "14"
        - Key: TableName
          Value: "信頼度スコアしきい値設定"

  DynamoDBTable15:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table15"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "15"
        - Key: TableName
          Value: "検証ルール定義"

  DynamoDBTable16:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table16"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 受注データ品質管理・検証システム
        - Key: TableIndex
          Value: "16"
        - Key: TableName
          Value: "過去受注履歴"

  # ── Lambda 関数 ───────────────────────────────────────────────
  AivicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: lambda/
      Handler: handler.handler
      Description: "AIVIC CRUD API for 受注データ品質管理・検証システム"
      Environment:
        Variables:
        AIVIC_TABLE_0: !Ref DynamoDBTable0
        AIVIC_TABLE_1: !Ref DynamoDBTable1
        AIVIC_TABLE_2: !Ref DynamoDBTable2
        AIVIC_TABLE_3: !Ref DynamoDBAIOCR
        AIVIC_TABLE_4: !Ref DynamoDBTable4
        AIVIC_TABLE_5: !Ref DynamoDBTable5
        AIVIC_TABLE_6: !Ref DynamoDBTable6
        AIVIC_TABLE_7: !Ref DynamoDBTable7
        AIVIC_TABLE_8: !Ref DynamoDBTable8
        AIVIC_TABLE_9: !Ref DynamoDBTable9
        AIVIC_TABLE_10: !Ref DynamoDBTable10
        AIVIC_TABLE_11: !Ref DynamoDBTable11
        AIVIC_TABLE_12: !Ref DynamoDBTable12
        AIVIC_TABLE_13: !Ref DynamoDBTable13
        AIVIC_TABLE_14: !Ref DynamoDBTable14
        AIVIC_TABLE_15: !Ref DynamoDBTable15
        AIVIC_TABLE_16: !Ref DynamoDBTable16
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
            - !GetAtt DynamoDBTable0.Arn
            - !GetAtt DynamoDBTable1.Arn
            - !GetAtt DynamoDBTable2.Arn
            - !GetAtt DynamoDBAIOCR.Arn
            - !GetAtt DynamoDBTable4.Arn
            - !GetAtt DynamoDBTable5.Arn
            - !GetAtt DynamoDBTable6.Arn
            - !GetAtt DynamoDBTable7.Arn
            - !GetAtt DynamoDBTable8.Arn
            - !GetAtt DynamoDBTable9.Arn
            - !GetAtt DynamoDBTable10.Arn
            - !GetAtt DynamoDBTable11.Arn
            - !GetAtt DynamoDBTable12.Arn
            - !GetAtt DynamoDBTable13.Arn
            - !GetAtt DynamoDBTable14.Arn
            - !GetAtt DynamoDBTable15.Arn
            - !GetAtt DynamoDBTable16.Arn
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}
            Method: ANY
        ApiItem:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}/{id}
            Method: ANY
        ApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{proxy+}
            Method: OPTIONS

  # ── API Gateway ───────────────────────────────────────────────
  AivicApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL (config.js に設定してください)"
    Value: !Sub "https://${AivicApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  Table0Name:
    Description: "DynamoDB table name for 受注データ検証結果"
    Value: !Ref DynamoDBTable0

  Table1Name:
    Description: "DynamoDB table name for 受注データ修正履歴"
    Value: !Ref DynamoDBTable1

  Table2Name:
    Description: "DynamoDB table name for 信頼度スコア"
    Value: !Ref DynamoDBTable2

  Table3Name:
    Description: "DynamoDB table name for AI_OCR読込結果"
    Value: !Ref DynamoDBAIOCR

  Table4Name:
    Description: "DynamoDB table name for 音声ガイダンス記録"
    Value: !Ref DynamoDBTable4

  Table5Name:
    Description: "DynamoDB table name for 重複受注検出"
    Value: !Ref DynamoDBTable5

  Table6Name:
    Description: "DynamoDB table name for チャネル間矛盾検出"
    Value: !Ref DynamoDBTable6

  Table7Name:
    Description: "DynamoDB table name for 連携承認フロー"
    Value: !Ref DynamoDBTable7

  Table8Name:
    Description: "DynamoDB table name for 承認者判定履歴"
    Value: !Ref DynamoDBTable8

  Table9Name:
    Description: "DynamoDB table name for 基幹システム連携ログ"
    Value: !Ref DynamoDBTable9

  Table10Name:
    Description: "DynamoDB table name for 操作履歴"
    Value: !Ref DynamoDBTable10

  Table11Name:
    Description: "DynamoDB table name for クライアント情報"
    Value: !Ref DynamoDBTable11

  Table12Name:
    Description: "DynamoDB table name for 受注チャネル"
    Value: !Ref DynamoDBTable12

  Table13Name:
    Description: "DynamoDB table name for 修正対象優先度ランク"
    Value: !Ref DynamoDBTable13

  Table14Name:
    Description: "DynamoDB table name for 信頼度スコアしきい値設定"
    Value: !Ref DynamoDBTable14

  Table15Name:
    Description: "DynamoDB table name for 検証ルール定義"
    Value: !Ref DynamoDBTable15

  Table16Name:
    Description: "DynamoDB table name for 過去受注履歴"
    Value: !Ref DynamoDBTable16
