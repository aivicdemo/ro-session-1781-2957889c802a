window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const clientTbody = container.querySelector(\"#client-tbody\");\n  const timelineContainer = container.querySelector(\"#timeline-container\");\n  const policyPanel = container.querySelector(\"#policy-panel\");\n  const interactionForm = container.querySelector(\"#new-interaction-form\");\n  \n  let selectedClientId = null;\n  let allClients = [];\n  let allInteractions = [];\n  let allPolicies = [];\n\n  // ===== 1. クライアント一覧を描画 =====\n  function renderClients(clients) {\n    clientTbody.innerHTML = clients.map(c => `\n      <tr \n        data-id=\"${c.id}\" \n        class=\"client-row\" \n        style=\"cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 8px; transition: background 0.15s;\"\n      >\n        <td style=\"padding: 8px; font-size: 12px; color: var(--text);\">\n          <div style=\"font-weight: 500;\">${c.client_name || \"（名前なし）\"}</div>\n          <div style=\"font-size: 10px; color: var(--text-muted); margin-top: 2px;\">${c.status || \"\"}</div>\n        </td>\n      </tr>\n    `).join(\"\");\n\n    // クライアント行クリックで選択\n    container.querySelectorAll(\".client-row\").forEach(row => {\n      row.addEventListener(\"click\", () => {\n        container.querySelectorAll(\".client-row\").forEach(r => r.style.background = \"transparent\");\n        row.style.background = \"rgba(255,165,0,0.15)\";\n        selectedClientId = row.dataset.id;\n        renderTimeline();\n        renderPolicy();\n      });\n    });\n  }\n\n  // ===== 2. 対応履歴タイムラインを描画 =====\n  function renderTimeline() {\n    if (!selectedClientId) {\n      timelineContainer.innerHTML = '<div style=\"text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;\">クライアントを選択してください</div>';\n      return;\n    }\n\n    const interactions = allInteractions.filter(i => i.client_id === selectedClientId).sort((a, b) => new Date(b.interaction_date) - new Date(a.interaction_date));\n\n    if (interactions.length === 0) {\n      timelineContainer.innerHTML = '<div style=\"text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;\">対応履歴がありません</div>';\n      return;\n    }\n\n    timelineContainer.innerHTML = interactions.map((inter, idx) => {\n      const date = new Date(inter.interaction_date);\n      const dateStr = date.toLocaleDateString(\"ja-JP\", { month: \"2-digit\", day: \"2-digit\" });\n      const timeStr = date.toLocaleTimeString(\"ja-JP\", { hour: \"2-digit\", minute: \"2-digit\" });\n      \n      return `\n        <div style=\"display: flex; gap: 8px; margin-bottom: 12px; position: relative;\">\n          <div style=\"width: 2px; background: var(--primary); flex-shrink: 0; ${idx === interactions.length - 1 ? \"height: 20px;\" : \"flex: 1;\"}\"></div>\n          <div style=\"flex: 1; padding: 8px; border: 1px solid rgba(255,165,0,0.3); border-radius: 3px; background: rgba(255,165,0,0.08);\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;\">\n              <div style=\"font-weight: 600; font-size: 11px; color: var(--text);\">${inter.interaction_type || \"対応\"}</div>\n              <div style=\"font-size: 10px; color: var(--text-muted);\">${dateStr} ${timeStr}</div>\n            </div>\n            <div style=\"font-size: 10px; color: var(--text-muted); margin-bottom: 4px;\">対応者: ${inter.user_name || \"（未設定）\"}</div>\n            ${inter.result ? `<div style=\"font-size: 10px; color: var(--primary); margin-bottom: 4px;\">結果: ${inter.result}</div>` : \"\"}\n            <div style=\"font-size: 11px; color: var(--text); line-height: 1.4; white-space: pre-wrap; word-break: break-word;\">${inter.content || \"\"}</div>\n            <div style=\"display: flex; gap: 4px; margin-top: 6px;\">\n              <button class=\"action-btn secondary edit-interaction-btn\" data-id=\"${inter.id}\" style=\"padding: 3px 8px; font-size: 10px;\">編集</button>\n              <button class=\"action-btn secondary delete-interaction-btn\" data-id=\"${inter.id}\" style=\"padding: 3px 8px; font-size: 10px;\">削除</button>\n            </div>\n          </div>\n        </div>\n      `;\n    }).join(\"\");\n  }\n\n  // ===== 3. 対応方針を表示 =====\n  function renderPolicy() {\n    if (!selectedClientId) {\n      policyPanel.innerHTML = '<div style=\"text-align: center; padding: 8px; color: var(--text-muted);\">方針情報なし</div>';\n      return;\n    }\n\n    const policy = allPolicies.find(p => p.client_id === selectedClientId && p.status === \"有効\");\n\n    if (!policy) {\n      policyPanel.innerHTML = '<div style=\"text-align: center; padding: 8px; color: var(--text-muted);\">対応方針が設定されていません</div>';\n      return;\n    }\n\n    policyPanel.innerHTML = `\n      <div style=\"padding: 6px; border-left: 3px solid var(--primary); background: rgba(255,165,0,0.08);\">\n        <div style=\"font-weight: 600; font-size: 11px; color: var(--text); margin-bottom: 4px;\">${policy.policy_name || \"方針\"}</div>\n        <div style=\"font-size: 10px; color: var(--text-muted); line-height: 1.4; margin-bottom: 4px;\">${policy.policy_content || \"\"}</div>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 9px; color: var(--text-muted);\">\n          <div>優先度: <span style=\"color: var(--text);\">${[\"高\", \"中\", \"低\"][policy.priority - 1] || \"中\"}</span></div>\n          <div>頻度: <span style=\"color: var(--text);\">${policy.frequency || \"未設定\"}</span></div>\n        </div>\n      </div>\n    `;\n  }\n\n  // ===== 4. 初期データ読み込み =====\n  async function loadData() {\n    // クライアント一覧\n    const clients = await window.aivicApi.list(1); // テーブルインデックス 1 = クライアント\n    allClients = clients || [];\n    renderClients(allClients);\n\n    // 対応履歴\n    const interactions = await window.aivicApi.list(2); // テーブルインデックス 2 = 対応履歴\n    allInteractions = interactions || [];\n\n    // 対応方針\n    const policies = await window.aivicApi.list(3); // テーブルインデックス 3 = 対応方針\n    allPolicies = policies || [];\n  }\n\n  // ===== 5. クライアント検索 =====\n  container.querySelector(\"#client-search-btn\").addEventListener(\"click\", async () => {\n    const keyword = container.querySelector(\"#client-search-input\").value.toLowerCase();\n    const filtered = allClients.filter(c => \n      (c.client_name || \"\").toLowerCase().includes(keyword) ||\n      (c.status || \"\").toLowerCase().includes(keyword)\n    );\n    renderClients(filtered);\n  });\n\n  // ===== 6. 新規対応記録 =====\n  interactionForm.addEventListener(\"submit\", async (e) => {\n    e.preventDefault();\n\n    if (!selectedClientId) {\n      alert(\"クライアントを選択してください\");\n      return;\n    }\n\n    const formData = new FormData(interactionForm);\n    const newInteraction = {\n      client_id: selectedClientId,\n      user_id: formData.get(\"user_id\"),\n      interaction_type: formData.get(\"interaction_type\"),\n      interaction_date: formData.get(\"interaction_date\"),\n      content: formData.get(\"content\"),\n      result: formData.get(\"result\"),\n      status: \"完了\"\n    };\n\n    const saved = await window.aivicApi.save(2, newInteraction); // テーブルインデックス 2 = 対応履歴\n    if (saved) {\n      interactionForm.reset();\n      const interactions = await window.aivicApi.list(2);\n      allInteractions = interactions || [];\n      renderTimeline();\n    }\n  });\n\n  // ===== 7. 対応履歴の削除 =====\n  container.addEventListener(\"click\", async (e) => {\n    const deleteBtn = e.target.closest(\".delete-interaction-btn\");\n    if (deleteBtn) {\n      if (!confirm(\"この対応履歴を削除しますか？\")) return;\n      const id = deleteBtn.dataset.id;\n      await window.aivicApi.delete(2, id); // テーブルインデックス 2 = 対応履歴\n      const interactions = await window.aivicApi.list(2);\n      allInteractions = interactions || [];\n      renderTimeline();\n    }\n  });\n\n  // 初期データ読み込み\n  loadData();\n}";
</script>

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
